# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "zapier-pp-cli"
display_name = "Zapier"
description = "Read-only CLI for your Zapier account: list zaps, check run history, diagnose failures."
project_kind = "cli"

[secrets.file]
path = "~/.config/zapier-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
ZAPIER_SESSION_COOKIE = true
