name: zapier
description: "Read-only CLI for your Zapier account: list zaps, check run history, diagnose failures. Never modifies, deletes, or toggles anything."
version: "0.1.0"
base_url: "https://zapier.com"
website_url: "https://zapier.com"
health_check_path: "/api/v4/session"

auth:
  type: api_key
  header: "Cookie"
  format: "{token}"
  instructions: "Run zapier-pp-cli auth browser. It installs a pinned browser helper and managed Chrome for Testing when missing. Sign in in the dedicated window; the CLI privately transfers Zapier-scoped cookies to local credential storage."
  env_vars:
    - ZAPIER_SESSION_COOKIE

resources:
  session:
    description: "Session/account status"
    endpoints:
      check:
        method: GET
        path: "/api/v4/session"
        description: "Read the current Zapier session and report the connected account without changing it"
        response:
          type: object

types: {}
